services:
  backend:
    build:
      context: ./WebApplication1/WebApplication1
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/orders.db
    volumes:
      - ./WebApplication1/WebApplication1/data:/app/data

  frontend:
    build:
      context: ./delivery-frontend
      args:
        VITE_API_URL: http://localhost:8081
    ports:
      - "5173:80"
    depends_on:
      - backend